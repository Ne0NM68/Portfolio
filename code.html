<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Personal Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-deep: #050b12;
    --bg-card: rgba(11, 30, 42, 0.55);
    --bg-card-hover: rgba(14, 40, 55, 0.75);
    --border-soft: rgba(64, 224, 208, 0.15);
    --border-glow: rgba(64, 224, 208, 0.55);
    --neon-cyan: #40e0d0;
    --neon-teal: #14ffec;
    --neon-mint: #7fffd4;
    --text-primary: #e6f7f5;
    --text-muted: #4a6b75;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 2.5rem 1.5rem 4rem;
    position: relative;
    overflow-x: hidden;
    line-height: 1.5;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(20,255,236,0.08), transparent 60%),
      radial-gradient(ellipse 70% 50% at 90% 100%, rgba(0,180,216,0.10), transparent 60%),
      linear-gradient(180deg, #050b12 0%, #061620 50%, #050b12 100%);
    z-index: -2;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(64,224,208,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(64,224,208,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    z-index: -1;
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 90%);
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 90%);
    pointer-events: none;
  }
  .portfolio { max-width: 1320px; margin: 0 auto; position: relative; }

  /* ШАПКА */
  .header {
    position: relative;
    padding: 2.4rem 2.6rem;
    margin-bottom: 2.5rem;
    border-radius: 4px;
    background: linear-gradient(135deg, rgba(11,30,42,0.7), rgba(7,26,36,0.5));
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-soft);
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute; inset: 0;
    padding: 1px;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(64,224,208,0.5), transparent 40%, transparent 60%, rgba(0,180,216,0.4));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .header::after {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 60%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--neon-teal), transparent);
    animation: scanLine 6s linear infinite;
  }
  @keyframes scanLine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem;
  }
  .logo-mark { display: flex; align-items: center; gap: 0.9rem; }
  .logo-mark svg { width: 38px; height: 38px; filter: drop-shadow(0 0 6px rgba(64,224,208,0.7)); }
  .logo-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.85rem; letter-spacing: 0.4em;
    text-transform: uppercase; color: var(--neon-teal);
    font-weight: 500; text-shadow: 0 0 10px rgba(20,255,236,0.5);
  }
  .status-badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase;
    color: #7fa8b0; padding: 0.4rem 0.9rem;
    border: 1px solid var(--border-soft); border-radius: 2px;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--neon-teal); box-shadow: 0 0 8px var(--neon-teal);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }
  .header-fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1.8rem;
  }
  .field-group { display: flex; flex-direction: column; gap: 0.55rem; }
  .field-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.68rem; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--text-muted); font-weight: 500;
  }
  .header-input {
    background: transparent; border: none;
    border-bottom: 1px solid var(--border-soft);
    padding: 0.55rem 0;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.35rem; font-weight: 500;
    color: var(--text-primary); outline: none;
    transition: all 0.3s ease; letter-spacing: 0.02em;
    width: 100%;
  }
  .header-input::placeholder { color: var(--text-muted); opacity: 0.5; font-weight: 300; font-size: 1.1rem; }
  .header-input:focus { border-bottom-color: var(--neon-teal); box-shadow: 0 8px 16px -8px rgba(20,255,236,0.5); }

  /* СЕТКА */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 1.8rem;
  }
  .card {
    position: relative;
    background: var(--bg-card);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    display: flex; flex-direction: column;
    transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    overflow: hidden;
  }
  .card:hover {
    background: var(--bg-card-hover);
    transform: translateY(-3px);
    box-shadow: 0 20px 60px -20px rgba(20,255,236,0.25);
  }
  .card .corner {
    position: absolute; width: 14px; height: 14px;
    border-color: var(--neon-teal); opacity: 0.4;
    transition: opacity 0.3s; pointer-events: none; z-index: 2;
  }
  .card .corner.tl { top: 8px; left: 8px; border-top: 1.5px solid; border-left: 1.5px solid; }
  .card .corner.tr { top: 8px; right: 8px; border-top: 1.5px solid; border-right: 1.5px solid; }
  .card .corner.bl { bottom: 8px; left: 8px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
  .card .corner.br { bottom: 8px; right: 8px; border-bottom: 1.5px solid; border-right: 1.5px solid; }
  .card:hover .corner { opacity: 1; }

  .card-header {
    padding: 1.7rem 1.8rem 1.3rem;
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; border-bottom: 1px solid var(--border-soft);
    position: relative;
  }
  .card-header-left { display: flex; align-items: center; gap: 1rem; min-width: 0; }
  .icon-wrap {
    width: 44px; height: 44px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 3px;
    background: rgba(20,255,236,0.04);
    border: 1px solid rgba(64,224,208,0.25);
    transition: all 0.35s;
  }
  .card:hover .icon-wrap {
    background: rgba(20,255,236,0.09);
    box-shadow: 0 0 20px rgba(20,255,236,0.35), inset 0 0 12px rgba(20,255,236,0.1);
  }
  .icon-wrap svg {
    width: 24px; height: 24px;
    stroke: var(--neon-teal); fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 4px rgba(20,255,236,0.7));
  }
  .card-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.05rem; font-weight: 600;
    color: var(--text-primary); letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .add-sub-btn {
    background: transparent;
    border: 1px solid var(--border-glow);
    color: var(--neon-teal);
    padding: 0.55rem 0.95rem; border-radius: 3px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.7rem; letter-spacing: 0.2em;
    text-transform: uppercase; font-weight: 500;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 0.5rem;
    transition: all 0.3s; white-space: nowrap;
  }
  .add-sub-btn:hover {
    background: var(--neon-teal); color: var(--bg-deep);
    border-color: var(--neon-teal);
    box-shadow: 0 0 24px rgba(20,255,236,0.5);
  }
  .add-sub-btn svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; fill: none; }

  .card-body {
    padding: 1.4rem 1.4rem 1.6rem;
    display: flex; flex-direction: column; gap: 1rem; flex: 1;
  }

  .sub-block {
    background: rgba(20,255,236,0.025);
    border: 1px solid rgba(64,224,208,0.12);
    border-radius: 3px;
    padding: 1.1rem 1.1rem 1.2rem;
    display: flex; flex-direction: column; gap: 0.9rem;
    transition: all 0.3s; position: relative;
  }
  .sub-block:hover {
    border-color: rgba(64,224,208,0.35);
    background: rgba(20,255,236,0.045);
  }
  .sub-header { display: flex; align-items: center; gap: 0.7rem; }
  .sub-title-input {
    flex: 1; background: transparent; border: none;
    border-bottom: 1px solid rgba(64,224,208,0.2);
    padding: 0.4rem 0;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.95rem; font-weight: 500;
    color: var(--neon-mint); outline: none;
    transition: all 0.3s; letter-spacing: 0.03em;
  }
  .sub-title-input::placeholder { color: var(--text-muted); opacity: 0.5; font-weight: 400; }
  .sub-title-input:focus { border-bottom-color: var(--neon-teal); box-shadow: 0 6px 12px -6px rgba(20,255,236,0.5); }
  .remove-sub-btn {
    background: transparent; border: 1px solid transparent;
    color: var(--text-muted); width: 26px; height: 26px;
    border-radius: 2px; cursor: pointer; font-size: 0.85rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s; flex-shrink: 0;
  }
  .remove-sub-btn:hover {
    color: #ff5c7a; border-color: rgba(255,92,122,0.5);
    box-shadow: 0 0 12px rgba(255,92,122,0.35);
  }
  .sub-content { display: flex; flex-direction: column; gap: 0.8rem; }
  .text-input {
    background: rgba(5,15,22,0.6);
    border: 1px solid rgba(64,224,208,0.12);
    border-radius: 3px;
    padding: 0.8rem 1rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem; color: var(--text-primary);
    resize: vertical; min-height: 70px;
    outline: none; transition: all 0.3s;
    line-height: 1.6; width: 100%;
  }
  .text-input:focus {
    border-color: var(--neon-teal);
    background: rgba(5,15,22,0.9);
    box-shadow: 0 0 0 3px rgba(20,255,236,0.1), 0 0 20px rgba(20,255,236,0.15);
  }
  .text-input::placeholder { color: var(--text-muted); opacity: 0.55; }

  .file-upload-row { display: flex; flex-direction: column; gap: 0.7rem; }
  .file-label {
    display: inline-flex; align-items: center; gap: 0.55rem;
    background: transparent;
    border: 1px dashed rgba(64,224,208,0.35);
    border-radius: 3px; padding: 0.6rem 1rem;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.7rem; letter-spacing: 0.18em;
    text-transform: uppercase; font-weight: 500;
    color: var(--neon-cyan); cursor: pointer;
    transition: all 0.3s; align-self: flex-start;
  }
  .file-label:hover {
    border-color: var(--neon-teal);
    background: rgba(20,255,236,0.06);
    box-shadow: 0 0 16px rgba(20,255,236,0.2);
    color: var(--neon-teal);
  }
  .file-label svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }
  .file-input { display: none; }
  .file-preview { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .file-item {
    display: flex; align-items: center; gap: 0.6rem;
    background: rgba(20,255,236,0.05);
    border: 1px solid rgba(64,224,208,0.2);
    border-radius: 3px;
    padding: 0.4rem 0.7rem 0.4rem 0.5rem;
    font-size: 0.8rem; color: var(--text-primary);
    max-width: 100%; transition: all 0.25s;
  }
  .file-item:hover { border-color: var(--neon-teal); box-shadow: 0 0 12px rgba(20,255,236,0.25); }
  .file-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
  .file-item img {
    width: 30px; height: 30px; object-fit: cover;
    border-radius: 2px; border: 1px solid rgba(64,224,208,0.4);
  }
  .file-item .file-icon {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 2px;
    background: rgba(20,255,236,0.08);
    color: var(--neon-teal);
    font-size: 0.65rem;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; letter-spacing: 0.05em;
  }
  .file-remove {
    background: transparent; border: none;
    color: var(--text-muted); cursor: pointer;
    font-size: 0.95rem; padding: 0 0.2rem;
    line-height: 1; transition: color 0.2s;
  }
  .file-remove:hover { color: #ff5c7a; }

  .empty-message {
    text-align: center; padding: 1.6rem 0.5rem;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.72rem; letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-muted); opacity: 0.6;
  }

  @media (max-width: 720px) {
    body { padding: 1.5rem 1rem 3rem; }
    .header { padding: 1.6rem 1.3rem; }
    .header-fields { gap: 1.3rem; }
    .header-input { font-size: 1.15rem; }
    .grid { grid-template-columns: 1fr; gap: 1.3rem; }
    .card-header { padding: 1.3rem 1.3rem 1.1rem; }
    .card-title { font-size: 0.95rem; }
    .add-sub-btn { padding: 0.5rem 0.75rem; font-size: 0.62rem; letter-spacing: 0.15em; }
    .card-body { padding: 1.2rem; }
  }
  @media (max-width: 420px) {
    .card-header { flex-direction: column; align-items: flex-start; gap: 0.8rem; }
    .add-sub-btn { align-self: flex-start; }
  }
</style>
</head>
<body>

<div class="portfolio">

  <header class="header">
    <div class="header-top">
      <div class="logo-mark">
        <svg viewBox="0 0 40 40">
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#14ffec"/>
              <stop offset="100%" stop-color="#00b4d8"/>
            </linearGradient>
          </defs>
          <polygon points="20,3 35,12 35,28 20,37 5,28 5,12" fill="none" stroke="url(#logoGrad)" stroke-width="1.5" stroke-linejoin="round"/>
          <polygon points="20,10 29,15 29,25 20,30 11,25 11,15" fill="none" stroke="url(#logoGrad)" stroke-width="1" opacity="0.6" stroke-linejoin="round"/>
          <circle cx="20" cy="20" r="2.5" fill="#14ffec"/>
        </svg>
        <span class="logo-text">Portfolio</span>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        Personal Space
      </div>
    </div>

    <div class="header-fields">
      <div class="field-group">
        <label class="field-label">Город</label>
        <input type="text" class="header-input" placeholder="Введите город">
      </div>
      <div class="field-group">
        <label class="field-label">Имя</label>
        <input type="text" class="header-input" placeholder="Введите имя">
      </div>
      <div class="field-group">
        <label class="field-label">Класс</label>
        <input type="text" class="header-input" placeholder="Введите класс">
      </div>
      <div class="field-group">
        <label class="field-label">Возраст</label>
        <input type="text" class="header-input" placeholder="Введите возраст">
      </div>
    </div>
  </header>

  <div class="grid" id="cardsGrid"></div>
</div>

<script>
  const ICONS = {
    achievements: '<svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-5 5 5 5 0 0 1-5-5V4z"/><path d="M5 6H3a2 2 0 0 0 2 2"/><path d="M19 6h2a2 2 0 0 1-2 2"/><path d="M12 13v5"/><path d="M8 20h8"/><path d="M10 20v-2h4v2"/></svg>',
    hobbies: '<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c1.5 0 2-1 2-2 0-1-1-1.5-1-3 0-1.5 1.5-2 3-2h2a3 3 0 0 0 3-3c0-5-4-8-9-8z"/><circle cx="7.5" cy="10.5" r="1.2"/><circle cx="12" cy="7.5" r="1.2"/><circle cx="16.5" cy="10.5" r="1.2"/></svg>',
    activities: '<svg viewBox="0 0 24 24"><path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg>',
    goals: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="#14ffec" stroke="none"/></svg>',
    projects: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>',
    skills: '<svg viewBox="0 0 24 24"><path d="M12 3l2.5 6L21 10l-5 4.5L17.5 21 12 17.5 6.5 21 8 14.5 3 10l6.5-1z"/></svg>'
  };

  const cardTitles = [
    { id: 'achievements', title: 'Достижения', icon: 'achievements' },
    { id: 'hobbies',      title: 'Увлечения',  icon: 'hobbies' },
    { id: 'activities',   title: 'Занятия',    icon: 'activities' },
    { id: 'goals',        title: 'Цели',       icon: 'goals' },
    { id: 'projects',     title: 'Проекты',    icon: 'projects' },
    { id: 'skills',       title: 'Навыки',     icon: 'skills' }
  ];

  const fileStore = new Map();

  function generateId() {
    return 'id_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
  }

  function createCard(cardId, title, iconKey) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.cardId = cardId;

    card.innerHTML =
      '<span class="corner tl"></span>' +
      '<span class="corner tr"></span>' +
      '<span class="corner bl"></span>' +
      '<span class="corner br"></span>' +
      '<div class="card-header">' +
        '<div class="card-header-left">' +
          '<div class="icon-wrap">' + (ICONS[iconKey] || '') + '</div>' +
          '<div class="card-title">' + title + '</div>' +
        '</div>' +
        '<button class="add-sub-btn" data-action="add-sub" data-card="' + cardId + '">' +
          '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>' +
          'Добавить' +
        '</button>' +
      '</div>' +
      '<div class="card-body" id="body-' + cardId + '">' +
        '<div class="empty-message" data-empty-for="' + cardId + '">Пусто</div>' +
      '</div>';

    return card;
  }

  function createSubBlock(cardId) {
    const subId = generateId();
    const sub = document.createElement('div');
    sub.className = 'sub-block';
    sub.dataset.subId = subId;
    sub.dataset.cardId = cardId;

    sub.innerHTML =
      '<div class="sub-header">' +
        '<input type="text" class="sub-title-input" placeholder="Название">' +
        '<button class="remove-sub-btn" title="Удалить">✕</button>' +
      '</div>' +
      '<div class="sub-content">' +
        '<textarea class="text-input" rows="3" placeholder="Текст..."></textarea>' +
        '<div class="file-upload-row">' +
          '<label class="file-label">' +
            '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>' +
            'Прикрепить файл' +
            '<input type="file" class="file-input" multiple>' +
          '</label>' +
          '<div class="file-preview"></div>' +
        '</div>' +
      '</div>';

    const removeBtn = sub.querySelector('.remove-sub-btn');
    const fileInput = sub.querySelector('.file-input');
    const filePreview = sub.querySelector('.file-preview');

    removeBtn.addEventListener('click', function () {
      for (const [key, url] of fileStore.entries()) {
        if (key.startsWith(subId + '_')) {
          URL.revokeObjectURL(url);
          fileStore.delete(key);
        }
      }
      sub.remove();
      updateEmptyState(cardId);
    });

    fileInput.addEventListener('change', function (e) {
      const files = e.target.files;
      if (!files.length) return;

      for (const file of files) {
        const fileId = generateId();
        const objectURL = URL.createObjectURL(file);
        fileStore.set(subId + '_' + fileId, objectURL);

        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';
        fileItem.dataset.fileId = fileId;

        if (file.type.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = objectURL;
          img.alt = file.name;
          fileItem.appendChild(img);
        } else {
          const ext = (file.name.split('.').pop() || 'FILE').substring(0, 4).toUpperCase();
          const icon = document.createElement('div');
          icon.className = 'file-icon';
          icon.textContent = ext;
          fileItem.appendChild(icon);
        }

        const nameSpan = document.createElement('span');
        nameSpan.textContent = file.name;
        fileItem.appendChild(nameSpan);

        const rmFile = document.createElement('button');
        rmFile.className = 'file-remove';
        rmFile.textContent = '✕';
        rmFile.title = 'Удалить файл';
        rmFile.addEventListener('click', function () {
          const key = subId + '_' + fileId;
          if (fileStore.has(key)) {
            URL.revokeObjectURL(fileStore.get(key));
            fileStore.delete(key);
          }
          fileItem.remove();
        });
        fileItem.appendChild(rmFile);

        filePreview.appendChild(fileItem);
      }

      fileInput.value = '';
    });

    return sub;
  }

  function updateEmptyState(cardId) {
    const body = document.getElementById('body-' + cardId);
    if (!body) return;
    const emptyMsg = body.querySelector('.empty-message');
    const subs = body.querySelectorAll('.sub-block');
    if (subs.length === 0) {
      if (emptyMsg) emptyMsg.style.display = 'block';
    } else {
      if (emptyMsg) emptyMsg.style.display = 'none';
    }
  }

  function addSubToCard(cardId) {
    const body = document.getElementById('body-' + cardId);
    if (!body) return;
    const emptyMsg = body.querySelector('.empty-message');
    if (emptyMsg) emptyMsg.style.display = 'none';

    const newSub = createSubBlock(cardId);
    body.appendChild(newSub);

    const titleInput = newSub.querySelector('.sub-title-input');
    if (titleInput) titleInput.focus();

    updateEmptyState(cardId);
  }

  document.addEventListener('DOMContentLoaded', function () {
    const grid = document.getElementById('cardsGrid');

    cardTitles.forEach(function (cardInfo) {
      const card = createCard(cardInfo.id, cardInfo.title, cardInfo.icon);
      grid.appendChild(card);
    });

    grid.addEventListener('click', function (e) {
      const addBtn = e.target.closest('.add-sub-btn');
      if (addBtn) {
        const cardId = addBtn.dataset.card;
        addSubToCard(cardId);
      }
    });
  });
</script>
</body>
</html>
